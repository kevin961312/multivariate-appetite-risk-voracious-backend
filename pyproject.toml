[project]
name = "voracious"
version = "0.1.0"
description = "Backend SaaS de apetito de riesgo multivariado con la carta de control robusta T2MRCD."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.142.2",
    "numpy>=2.5.3",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pymrcd",
    "scipy>=1.18.1",
    "structlog>=26.1.0",
    "threadpoolctl>=3.7.0",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/voracious"]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "import-linter>=2.15",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.10",
    # Solo para mypy sobre packages/pymrcd/setup.py (la compilación usa su propio entorno aislado
    # con setuptools >= 77, declarado en packages/pymrcd/pyproject.toml).
    "types-setuptools>=84",
]

# --- workspace de uv ------------------------------------------------------
# pymrcd: librería del port MRCD (ADR 0006), dependencia de runtime de voracious; solo la importa
# domain/estimators/mrcd/ (contrato de import-linter).
[tool.uv.workspace]
members = ["packages/pymrcd"]

[tool.uv.sources]
pymrcd = { workspace = true }

# --- ruff ------------------------------------------------------------------
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests", "packages/pymrcd/src", "packages/pymrcd/tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "N", "D", "ANN", "S", "RUF", "PT", "C4", "TID"]
# D401 exige modo imperativo en inglés; no aplica a docstrings en español.
ignore = ["D401"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "D", "PLR2004"]
"packages/pymrcd/tests/**" = ["S101", "D", "PLR2004"]

# --- mypy ------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
# typings/: stubs tipados mínimos de dependencias sin anotaciones (hoy, threadpoolctl).
mypy_path = "src:typings"
plugins = ["pydantic.mypy"]
warn_unreachable = true

# --- pytest ----------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
# tests/support: dobles en memoria y valores «solo test» compartidos por los tests (nunca en src/).
pythonpath = ["tests"]
addopts = "-ra --strict-markers --strict-config --import-mode=importlib"
xfail_strict = true
# M9 (Paso 4): los avisos de obsolescencia de la pila web son error, para enterarse al subir versiones
# (p. ej. starlette avisa con su propia clase, subclase de UserWarning, si TestClient usa httpx y no httpx2).
filterwarnings = [
    "error::starlette.exceptions.StarletteDeprecationWarning",
    "error::DeprecationWarning:starlette.*",
    "error::DeprecationWarning:fastapi.*",
    "error::DeprecationWarning:httpx2.*",
]

# --- coverage --------------------------------------------------------------
[tool.coverage.run]
source = ["voracious"]
branch = true

[tool.coverage.report]
exclude_also = ["if TYPE_CHECKING:"]
show_missing = true

# --- import-linter -----------------------------------------------------------
# Verifica la dirección de dependencias de CLAUDE.md, sección 2, y el aislamiento de pymrcd (ADR 0006).
[tool.importlinter]
root_packages = ["voracious", "pymrcd"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Capas: api|workers -> container -> infrastructure -> application -> domain"
type = "layers"
containers = ["voracious"]
# api y workers importan container (CLAUDE.md, sección 2); container cablea infrastructure.
layers = [
    "api | workers",
    "container",
    "infrastructure",
    "application",
    "domain",
]
exhaustive = true
exhaustive_ignores = ["config"]

[[tool.importlinter.contracts]]
name = "domain no importa configuración, frameworks ni IO"
type = "forbidden"
source_modules = ["voracious.domain"]
# Se amplía con sqlalchemy, redis, celery, boto3... cuando entren como dependencias.
# M1 (Paso 2): también IO, red, procesos e hilos de la stdlib; el reparto en procesos es un
# adaptador (TaskMapper) de infrastructure.
forbidden_modules = [
    "voracious.config",
    "voracious.container",
    "fastapi",
    "starlette",
    "pydantic",
    "pydantic_settings",
    "structlog",
    "httpx",
    "httpx2",
    "uvicorn",
    "multiprocessing",
    "concurrent",
    "threading",
    "socket",
    "io",
    "pathlib",
    "os",
]

[[tool.importlinter.contracts]]
name = "application no importa configuración ni frameworks web/logging"
type = "forbidden"
source_modules = ["voracious.application"]
forbidden_modules = [
    "voracious.config",
    "fastapi",
    "starlette",
    "uvicorn",
    "httpx",
    "httpx2",
    "structlog",
]

[[tool.importlinter.contracts]]
name = "config no importa ninguna capa del proyecto"
type = "forbidden"
source_modules = ["voracious.config"]
forbidden_modules = [
    "voracious.api",
    "voracious.application",
    "voracious.domain",
    "voracious.infrastructure",
    "voracious.workers",
    "voracious.container",
]

[[tool.importlinter.contracts]]
name = "api no importa config (la recibe a través de container)"
type = "forbidden"
source_modules = ["voracious.api"]
forbidden_modules = ["voracious.config"]
# Indirecto permitido: api -> container -> config es el camino legítimo.
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "api no importa infrastructure (solo a través de container)"
type = "forbidden"
source_modules = ["voracious.api"]
forbidden_modules = ["voracious.infrastructure"]
# Indirecto permitido: api -> container -> infrastructure es el camino legítimo.
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "pymrcd no importa voracious (ADR 0006)"
type = "forbidden"
source_modules = ["pymrcd"]
forbidden_modules = ["voracious"]

[[tool.importlinter.contracts]]
name = "pymrcd no importa dependencias fuera de numpy/scipy (ADR 0006)"
type = "forbidden"
source_modules = ["pymrcd"]
forbidden_modules = [
    "pandas",
    "rpy2",
    "sklearn",
    "statsmodels",
    "fastapi",
    "pydantic",
    "structlog",
]

# --- Paso 2: independencia de cartas y estimadores (ADR 0004, punto 4) --------
[[tool.importlinter.contracts]]
name = "Las cartas no se importan entre sí (ADR 0004)"
type = "independence"
modules = ["voracious.domain.charts.*"]

[[tool.importlinter.contracts]]
name = "Los estimadores no se importan entre sí (ADR 0004)"
type = "independence"
modules = ["voracious.domain.estimators.*"]

[[tool.importlinter.contracts]]
name = "Un estimador no conoce ninguna carta (ADR 0004)"
type = "forbidden"
source_modules = ["voracious.domain.estimators"]
forbidden_modules = ["voracious.domain.charts"]

[[tool.importlinter.contracts]]
name = "domain.common no importa cartas ni estimadores (ADR 0004)"
type = "forbidden"
source_modules = ["voracious.domain.common"]
forbidden_modules = ["voracious.domain.charts", "voracious.domain.estimators"]

[[tool.importlinter.contracts]]
name = "Solo domain.estimators.mrcd importa pymrcd (ADR 0006)"
type = "forbidden"
source_modules = [
    "voracious.api",
    "voracious.workers",
    "voracious.container",
    "voracious.infrastructure",
    "voracious.application",
    "voracious.config",
    "voracious.domain.charts",
    "voracious.domain.common",
]
forbidden_modules = ["pymrcd"]
# Indirecto permitido: p. ej. charts.t2mrcd -> estimators.mrcd -> pymrcd es el camino legítimo.
allow_indirect_imports = true

# --- Paso 3: workers sin infraestructura ni configuración directas ---------------
[[tool.importlinter.contracts]]
name = "workers no importa infrastructure ni config (solo a través de container)"
type = "forbidden"
source_modules = ["voracious.workers"]
forbidden_modules = ["voracious.infrastructure", "voracious.config"]
# Indirecto permitido: workers -> container -> infrastructure|config es el camino legítimo.
allow_indirect_imports = true
