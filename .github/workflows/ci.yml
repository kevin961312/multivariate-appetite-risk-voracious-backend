# CI de Voracious (Paso 4.1; Postgres en 4.2). La compuerta es la misma que en local y en el
# pre-commit (scripts/gate.sh), aquí en Linux x86-64 con gcc y Postgres 17 como servicio. Ningún trabajo publica imágenes ni artefactos
# fuera de GitHub (pymrcd es GPL-3.0-or-later; la imagen se construye donde se usa).
# Acciones fijadas por SHA (M5); Dependabot propone las subidas (.github/dependabot.yml).
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.12.23"
  PYTHON_VERSION: "3.12"

jobs:
  gate:
    name: compuerta (scripts/gate.sh)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # Paso 4.2: la compuerta exige Postgres; aquí lo da el servicio (gate.sh usa la URL y no
    # levanta otro). Credenciales de PRUEBA, no secretas: la base vive lo que dura el trabajo.
    services:
      postgres:
        image: postgres:17-trixie@sha256:2d2b8998d31037bf721cfdf764d76ba74171b4fab3431b7f72c27c56ddbdf9e3
        env:
          POSTGRES_USER: voracious_test
          POSTGRES_PASSWORD: voracious_test
          POSTGRES_DB: voracious_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U voracious_test -d voracious_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      VORACIOUS_TEST_DATABASE_URL: postgresql://voracious_test:voracious_test@127.0.0.1:5432/voracious_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Python
        run: uv python install "${PYTHON_VERSION}"
      - name: Dependencias (uv.lock al día con pyproject.toml)
        run: uv sync --locked
      - name: sops, age y shellcheck (M7 de seguridad mínima)
        # Con sops y age corre tests/integration/test_deploy_sops.py (sin ellos se salta) y con
        # shellcheck la etapa shellcheck de scripts/gate.sh (sin él sale en rojo). sops es el
        # binario oficial fijado por versión y SHA-256 (el de su checksums.txt); age y shellcheck,
        # paquetes de Ubuntu.
        env:
          SOPS_VERSION: "3.13.3"
          SOPS_SHA256: e5bec3346a873ae91d871550f3e698c1aad962aff462a080e40f25fde17fef6b
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends age shellcheck
          curl -fsSL -o "${RUNNER_TEMP}/sops" \
            "https://github.com/getsops/sops/releases/download/v${SOPS_VERSION}/sops-v${SOPS_VERSION}.linux.amd64"
          echo "${SOPS_SHA256}  ${RUNNER_TEMP}/sops" | sha256sum -c -
          sudo install -m 0755 "${RUNNER_TEMP}/sops" /usr/local/bin/sops
          sops --disable-version-check --version
          age --version
          shellcheck --version
      - name: Traza de la plataforma
        run: |
          uname -a
          gcc --version
          echo "CFLAGS del entorno: ${CFLAGS:-<vacío>}"
          uv run --no-sync python -c "import sysconfig; print('CC:', sysconfig.get_config_var('CC')); print('CFLAGS:', sysconfig.get_config_var('CFLAGS'))"
          uv run --no-sync python -c "import numpy; numpy.show_config()"
      - name: Compuerta
        run: scripts/gate.sh
      - name: Logs de la compuerta
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gates-${{ github.run_id }}
          path: .gates/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

  image:
    # Seguridad mínima (T13): la imagen real con la pila Compose completa, secretos de PRUEBA en
    # ficheros (Compose secrets + *_FILE) y una llave JWT efímera. Nada de esto es un secreto real:
    # la contraseña es aleatoria por ejecución y la llave muere con el runner.
    name: imagen runtime y pila Compose (sin publicar)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Secretos de PRUEBA en ficheros (0444 dentro de un directorio 0700)
        run: |
          secrets="${RUNNER_TEMP}/secrets"
          deploy="${RUNNER_TEMP}/deploy"
          install -d -m 700 "${secrets}"
          install -d -m 755 "${deploy}"
          password=$(openssl rand -hex 24)
          echo "::add-mask::${password}"
          (
            umask 077
            printf '%s' "${password}" > "${secrets}/postgres_password"
            printf 'postgresql://voracious:%s@postgres:5432/voracious' "${password}" > "${secrets}/database_url"
          )
          chmod 0444 "${secrets}/postgres_password" "${secrets}/database_url"
          cp deploy/demo/auth.env "${deploy}/auth.env"
          {
            echo "DEPLOY_SECRETS_DIR=${secrets}"
            echo "DEPLOY_DIR=${deploy}"
          } >> "${GITHUB_ENV}"
      - name: docker-compose.yml y compose.test.yaml válidos
        # Sin DEPLOY_SECRETS_DIR Compose no debe arrancar (falla cerrado); con él, valida.
        run: |
          if env -u DEPLOY_SECRETS_DIR docker compose config --quiet 2> /dev/null; then
            echo "docker compose config debe fallar sin DEPLOY_SECRETS_DIR"
            exit 1
          fi
          docker compose config --quiet
          docker compose -f compose.test.yaml config --quiet
      - name: Build (la etapa builder falla si el binario de pymrcd tiene FMA)
        # Hasta 3 intentos: un 504 pasajero de Docker Hub se reintenta; un fallo real del build
        # (p. ej. FMA en el binario) falla los 3 y el job sale en rojo igual.
        run: |
          for i in 1 2 3; do
            docker build --progress=plain --target runtime -t voracious:local . && exit 0
            echo "build falló (intento $i de 3)"
            [ "$i" -lt 3 ] && sleep 30
          done
          exit 1
      - name: Sin autenticación configurada la API no arranca
        run: |
          if timeout 60 docker run --rm --read-only --tmpfs /tmp voracious:local \
              > "${RUNNER_TEMP}/noauth.log" 2>&1; then
            echo "la imagen no debe arrancar sin VORACIOUS_JWT_*"
            exit 1
          fi
          grep -q VORACIOUS_JWT_JWKS_FILE "${RUNNER_TEMP}/noauth.log"
      - name: sops y age con una llave age efímera (la vía del servidor)
        # sops y age solo viven en el servidor (decisión del dueño, 2026-10-20); aquí se prueba esa
        # vía: jwt_keygen.sh e issue_token.sh --via docker, sin uv. sops es el binario oficial
        # fijado por versión y SHA-256 (como en el trabajo gate); age, el paquete de Ubuntu. La
        # llave age es de PRUEBA y muere con el runner.
        env:
          SOPS_VERSION: "3.13.3"
          SOPS_SHA256: e5bec3346a873ae91d871550f3e698c1aad962aff462a080e40f25fde17fef6b
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends age
          curl -fsSL -o "${RUNNER_TEMP}/sops" \
            "https://github.com/getsops/sops/releases/download/v${SOPS_VERSION}/sops-v${SOPS_VERSION}.linux.amd64"
          echo "${SOPS_SHA256}  ${RUNNER_TEMP}/sops" | sha256sum -c -
          sudo install -m 0755 "${RUNNER_TEMP}/sops" /usr/local/bin/sops
          key="${RUNNER_TEMP}/age/keys.txt"
          install -d -m 700 "${RUNNER_TEMP}/age"
          age-keygen -o "${key}" 2> /dev/null
          chmod 600 "${key}"
          printf 'creation_rules:\n  - path_regex: .*\\.enc\\.yaml$\n    age: %s\n' \
            "$(age-keygen -y "${key}")" > "${RUNNER_TEMP}/sops.yaml"
          {
            echo "SOPS_AGE_KEY_FILE=${key}"
            echo "SOPS_CONFIG=${RUNNER_TEMP}/sops.yaml"
          } >> "${GITHUB_ENV}"
      - name: Llave JWT efímera (scripts/jwt_keygen.sh --via docker; solo para este trabajo)
        run: |
          scripts/jwt_keygen.sh --via docker ci
          grep -q '"kid": "ci"' "${DEPLOY_DIR}/jwks.json"
          if grep -q '"d"' "${DEPLOY_DIR}/jwks.json"; then
            echo "el JWKS no puede llevar la parte privada"
            exit 1
          fi
          grep -q '^sops:' "${DEPLOY_DIR}/jwt-signing.enc.yaml"
          if grep -q 'PRIVATE KEY' "${DEPLOY_DIR}/jwt-signing.enc.yaml"; then
            echo "la llave de firma no está cifrada"
            exit 1
          fi
      - name: Pila Compose completa (postgres, migrate, api, backup)
        run: |
          docker compose up -d --no-build
          for _ in $(seq 1 90); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/ready || true)
            [ "${code}" = 200 ] && break
            sleep 2
          done
          test "${code}" = 200
      - name: /health, /ready, 401, token, docker inspect, backup, usuario, compilador y HEALTHCHECK
        run: |
          base=http://127.0.0.1:8000
          curl -fsS "${base}/health"
          echo
          # 200 ⇒ la API leyó VORACIOUS_DATABASE_URL_FILE (secreto montado) y conectó a Postgres.
          curl -fsS "${base}/ready"
          echo
          code=$(curl -s -D "${RUNNER_TEMP}/h401" -o /dev/null -w '%{http_code}' "${base}/v1/datasets/nope")
          test "${code}" = 401
          grep -qi '^www-authenticate: Bearer realm="voracious"' "${RUNNER_TEMP}/h401"
          token=$(scripts/issue_token.sh --via docker --tenant ci --roles analyst --subject ci --ttl 10m)
          echo "::add-mask::${token}"
          response=$(curl -s -H "Authorization: Bearer ${token}" -w '\n%{http_code}' "${base}/v1/datasets/nope")
          test "$(printf '%s\n' "${response}" | tail -n 1)" = 404
          printf '%s\n' "${response}" | head -n 1 | grep -q '"code":"DATASET_NOT_FOUND"'
          # Ni la query ni la ruta cruda llegan al registro (uvicorn con --no-access-log; el
          # registro propio solo escribe la plantilla de la ruta).
          marker="marca-query-$(openssl rand -hex 8)"
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer ${token}" "${base}/v1/datasets/x?access_token=${marker}")
          test "${code}" = 404
          sleep 1
          docker compose logs --no-color api > "${RUNNER_TEMP}/api.log"
          grep -q '"event": *"http_request"' "${RUNNER_TEMP}/api.log"
          if grep -F -q "${marker}" "${RUNNER_TEMP}/api.log"; then
            echo "el registro de la API contiene la query de la petición"
            exit 1
          fi
          # Ningún valor secreto en docker inspect (ni la contraseña ni la URL).
          docker compose ps -aq | xargs docker inspect > "${RUNNER_TEMP}/inspect.json"
          for name in postgres_password database_url; do
            cat "${DEPLOY_SECRETS_DIR}/${name}"
            echo
          done | grep -v '^$' > "${RUNNER_TEMP}/patterns"
          if grep -F -q -f "${RUNNER_TEMP}/patterns" "${RUNNER_TEMP}/inspect.json"; then
            echo "docker inspect contiene un valor secreto"
            exit 1
          fi
          postgres=$(docker compose ps -q postgres)
          test "$(docker inspect --format '{{len .HostConfig.PortBindings}}' "${postgres}")" = 0
          test "$(docker compose port api 8000)" = 127.0.0.1:8000
          # El volcado prueba que backup leyó la contraseña del fichero del secreto.
          for _ in $(seq 1 30); do
            docker compose logs backup | grep -q 'backup: voracious-' && break
            sleep 2
          done
          docker compose logs backup | grep 'backup: voracious-'
          uid=$(docker compose exec -T api id -u)
          echo "uid: ${uid}"
          test "${uid}" != "0"
          if docker compose exec -T api sh -c 'command -v gcc || command -v cc'; then
            echo "la imagen runtime no debe tener compilador"
            exit 1
          fi
          api=$(docker compose ps -q api)
          for _ in $(seq 1 40); do
            status=$(docker inspect --format '{{.State.Health.Status}}' "${api}")
            [ "${status}" = healthy ] && break
            sleep 3
          done
          echo "HEALTHCHECK: ${status}"
          test "${status}" = healthy
      - name: Logs y limpieza
        if: always()
        run: |
          docker compose logs --no-color || true
          docker compose down -v --remove-orphans || true

  sanitizers:
    # M2: la extensión C de pymrcd con ASan y UBSan; cualquier aviso aborta (-fno-sanitize-recover).
    # Las opciones obligatorias de setup.py (-O2 -std=c11 -ffp-contract=off ...) van al final de la
    # línea de compilación, después de estas CFLAGS, y por tanto prevalecen.
    name: pymrcd con ASan/UBSan
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CC: gcc
      CFLAGS: -fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=all
      LDFLAGS: -fsanitize=address,undefined
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock
          # Caché aparte: aquí pymrcd se compila con sanitizadores.
          cache-suffix: sanitizers
      - name: Python
        run: uv python install "${PYTHON_VERSION}"
      - name: Compilar pymrcd con sanitizadores
        # Sin packages/pymrcd/build: setuptools reutiliza los .o si las fuentes no cambiaron, aunque
        # cambien las CFLAGS.
        run: |
          uv sync --locked
          rm -rf packages/pymrcd/build
          uv sync --locked --reinstall-package pymrcd
      - name: Tests de Qn y barrido poison bajo ASan/UBSan
        # La extensión instrumentada exige el runtime de ASan cargado antes que nada (LD_PRELOAD).
        # Se excluye test_import_without_extension_fails_explicitly: lanza un intérprete hijo y con
        # LD_PRELOAD de ASan el hijo muere con SIGILL antes de ejecutar nada (visto en Linux aarch64
        # con gcc 14); no ejercita el C y ya corre en el trabajo gate.
        run: |
          export LD_PRELOAD="$(gcc -print-file-name=libasan.so)"
          export ASAN_OPTIONS=detect_leaks=0
          export UBSAN_OPTIONS=print_stacktrace=1:halt_on_error=1
          so=$(uv run --no-sync python -c "import pymrcd._qn_ext as m; print(m.__file__)")
          ldd "${so}" | grep -E 'libasan|libubsan'
          uv run --no-sync pytest -c packages/pymrcd/pyproject.toml --rootdir packages/pymrcd \
            -p no:cacheprovider packages/pymrcd/tests/test_qn_ext.py packages/pymrcd/tests/test_qn.py \
            -k "not test_import_without_extension_fails_explicitly"
          uv run --no-sync python scripts/pymrcd_poison_sweep.py 2000

  fma-strict:
    # M3: con -march=x86-64-v3 el compilador tiene FMA a mano; el binario debe seguir sin ninguna
    # (las opciones de setup.py van después de estas CFLAGS) y los tests de Qn deben dar los mismos bits.
    name: pymrcd sin FMA con -march=x86-64-v3
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CFLAGS: -march=x86-64-v3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock
          cache-suffix: fma-strict
      - name: Python
        run: uv python install "${PYTHON_VERSION}"
      - name: La CPU del runner ejecuta x86-64-v3 (AVX2 y FMA)
        run: grep -qw avx2 /proc/cpuinfo && grep -qw fma /proc/cpuinfo
      - name: Compilar pymrcd con -march=x86-64-v3
        run: |
          uv sync --locked
          rm -rf packages/pymrcd/build
          uv sync --locked --reinstall-package pymrcd
      - name: Cero FMA en el binario
        run: scripts/check_pymrcd_fma.sh
      - name: Tests de Qn con el binario x86-64-v3
        run: |
          uv run --no-sync pytest -c packages/pymrcd/pyproject.toml --rootdir packages/pymrcd \
            -p no:cacheprovider packages/pymrcd/tests/test_qn_ext.py packages/pymrcd/tests/test_qn.py
      - name: La comprobación muerde (con -ffp-contract=fast debe dar rojo)
        # Prueba negativa en una copia del árbol del runner (nada se versiona): si el binario
        # contraído pasara la comprobación, la comprobación no serviría.
        run: |
          sed -i 's/"-ffp-contract=off"/"-ffp-contract=fast"/' packages/pymrcd/setup.py
          grep -q '"-ffp-contract=fast"' packages/pymrcd/setup.py
          rm -rf packages/pymrcd/build
          uv sync --locked --reinstall-package pymrcd
          if scripts/check_pymrcd_fma.sh; then
            echo "check_pymrcd_fma.sh no detectó las FMA de un binario contraído"
            exit 1
          fi
          echo "rojo esperado: la comprobación detecta las FMA"
