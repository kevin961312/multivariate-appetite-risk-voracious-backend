[project]
name = "pymrcd"
version = "0.1.0"
description = "Port a Python de rrcov::CovMrcd (MRCD, Boudt et al. 2020), fiel a rrcov 1.7-7."
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.13"
# Cotas superiores deliberadas (ADR 0006): pymrcd llama por puntero a las cápsulas internas de
# Cython de scipy (`scipy.linalg.cython_blas.__pyx_capi__`, `_blasptr.py`), cuya firma no es API
# pública y puede cambiar en una versión menor; y la fidelidad bit a bit con R se ha validado con
# estas versiones concretas de scipy/numpy (BLAS/LAPACK enlazados, orden de operaciones). Subir una
# cota exige volver a pasar los golden.
dependencies = [
    "numpy>=2.5.3,<3",
    "scipy>=1.18.1,<1.19",
]

# Extensión C `pymrcd._qn_ext` (qn0 de robustbase y U de OGK; especificación §3.12.9): setuptools
# >= 77 por los metadatos de licencia PEP 639; `setup.py` solo declara `ext_modules`.
[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
include = ["pymrcd*"]

[tool.setuptools.package-data]
pymrcd = ["py.typed", "*.pyi", "_ext/*.c", "_ext/*.h"]

# uv recompila la extensión cuando cambia el C, setup.py o este archivo (si no, reutiliza la caché).
[tool.uv]
cache-keys = [
    { file = "pyproject.toml" },
    { file = "setup.py" },
    { file = "src/pymrcd/_ext/*.c" },
    { file = "src/pymrcd/_ext/*.h" },
]

# --- mypy ------------------------------------------------------------------
# Propio de pymrcd: sin plugin de pydantic (pymrcd no depende de pydantic).
[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
warn_unreachable = true

# --- pytest ----------------------------------------------------------------
# La compuerta lo usa con `-c packages/pymrcd/pyproject.toml` para no heredar la config de la raíz.
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-ra --strict-markers --strict-config --import-mode=importlib"
xfail_strict = true

# --- coverage --------------------------------------------------------------
[tool.coverage.run]
source = ["pymrcd"]
branch = true

[tool.coverage.report]
exclude_also = ["if TYPE_CHECKING:"]
show_missing = true

# scipy no publica anotaciones de tipos (sin scipy-stubs en el entorno): sus resultados se convierten
# siempre con np.asarray(..., dtype=np.float64) en la frontera.
[[tool.mypy.overrides]]
module = ["scipy", "scipy.*"]
ignore_missing_imports = true
